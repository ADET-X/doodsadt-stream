<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<!-- Web Push Monetag -->
<script src="https://5gvci.com/act/files/tag.min.js?z=11377004" data-cfasync="false" async></script>

<!-- Popunder Monetag (Format 1 Baris) -->
<script>(function(s){s.dataset.zone='11376911',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    background: #000;
}

.error-msg {
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<video
    id="video"
    controls
    playsinline
    preload="metadata">
</video>

<script>
const video = document.getElementById("video");

// 1. Membaca parameter dari URL (contoh: doodsadt.online/?id=Ma9785s1)
const params = new URLSearchParams(window.location.search);
let id = params.get("id");

if (id) {
    // 2. Tambahkan .mp4 jika belum ada
    if (!id.toLowerCase().endsWith(".mp4")) {
        id += ".mp4";
    }

    // 3. Masukkan link CDN Videy
    video.src = "https://cdn.videy.co/" + id;
    video.load();
} else {
    // 4. Tampilan jika tanpa parameter ?id=...
    document.body.innerHTML = '<div class="error-msg"><h2>ID Video tidak ditemukan!<br><small style="font-size:16px; color:#aaa; font-weight:normal;">Gunakan format: doodsadt.online/?id=Ma9785s1</small></h2></div>';
}
</script>

</body>
</html>
